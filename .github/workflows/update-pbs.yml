name: Update proxmox-backup-client-static

on:
    schedule:
        - cron: "0 * * * *"
    workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
    contents: write

concurrency:
    group: update-proxmox-backup-client-static
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout tap
              uses: actions/checkout@v4

            - name: Check upstream APT repo and update formula
              id: check
              env:
                  PYTHONWARNINGS: ignore
              run: |
                  python3 - <<'EOF'
                  import os
                  import re
                  import subprocess
                  import urllib.request
                  from pathlib import Path

                  PACKAGES_URL = "http://download.proxmox.com/debian/pbs-client/dists/trixie/main/binary-amd64/Packages"
                  BASE_URL = "http://download.proxmox.com/debian/pbs-client/"
                  FORMULA_PATH = Path("Formula/proxmox-backup-client-static.rb")

                  text = urllib.request.urlopen(PACKAGES_URL, timeout=30).read().decode("utf-8")

                  candidates = []
                  for stanza in text.strip().split("\n\n"):
                      fields = {}
                      for line in stanza.splitlines():
                          if ": " in line and not line.startswith(" "):
                              k, v = line.split(": ", 1)
                              fields[k] = v.strip()
                      if fields.get("Package") == "proxmox-backup-client-static":
                          candidates.append(fields)

                  if not candidates:
                      raise SystemExit("Package not found in Proxmox Packages index")

                  best = candidates[0]
                  for c in candidates[1:]:
                      res = subprocess.run(["dpkg", "--compare-versions", c["Version"], "gt", best["Version"]])
                      if res.returncode == 0:
                          best = c

                  new_url = BASE_URL + best["Filename"]
                  new_ver = best["Version"]
                  new_sha = best["SHA256"]

                  content = FORMULA_PATH.read_text()

                  def replace_field(pattern, value, source):
                      # Only touch the first match so the livecheck block keeps its URL.
                      updated, count = re.subn(
                          pattern, lambda m: m.group(1) + f'"{value}"', source, count=1, flags=re.M
                      )
                      if count != 1:
                          raise SystemExit(f"Could not update formula field matching {pattern!r}")
                      return updated

                  updated = replace_field(r'^(  url\s+)"[^"]+"', new_url, content)
                  updated = replace_field(r'^(  version\s+)"[^"]+"', new_ver, updated)
                  updated = replace_field(r'^(  sha256\s+)"[^"]+"', new_sha, updated)

                  # The old bottle was built for the old version, so a stale block would
                  # make brew try to pour a bottle that does not exist. Drop it; the
                  # "Build bottle" step adds a fresh block for the new version.
                  updated = re.sub(r'\n  bottle do\n.*?\n  end\n', '', updated, flags=re.S)

                  # Build a bottle when the formula has none yet (e.g. the very first
                  # run), so users without a compiler can install it.
                  needs_bottle = re.search(r'^  bottle do$', content, flags=re.M) is None

                  changed = (updated != content) or needs_bottle
                  if updated != content:
                      FORMULA_PATH.write_text(updated)
                      print(f"Updated formula to {new_ver}")
                  elif needs_bottle:
                      print(f"Formula is already at {new_ver}, but has no bottle yet")
                  else:
                      print(f"Already up to date ({new_ver})")

                  with open(Path(os.environ["GITHUB_OUTPUT"]), "a") as out:
                      out.write(f"changed={'true' if changed else 'false'}\n")
                      out.write(f"version={new_ver}\n")
                  EOF

            # Commit before testing: "brew tap file://..." clones the git repo, so an
            # uncommitted change on disk would not be picked up by brew.
            - name: Commit formula update
              if: steps.check.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Formula/proxmox-backup-client-static.rb
                  if git diff --cached --quiet; then
                      echo "Formula fields are unchanged; no commit needed"
                  else
                      git commit -m "proxmox-backup-client-static ${{ steps.check.outputs.version }}"
                  fi

            - name: Test updated formula with Linuxbrew
              if: steps.check.outputs.changed == 'true'
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  export HOMEBREW_NO_AUTO_UPDATE=1
                  brew tap local/test "file://$GITHUB_WORKSPACE"
                  brew install --verbose local/test/proxmox-backup-client-static
                  brew test local/test/proxmox-backup-client-static

            # Users on Linux without a compiler cannot install a source-only formula,
            # so publish a bottle for every update.
            - name: Build bottle
              if: steps.check.outputs.changed == 'true'
              env:
                  ROOT_URL: https://github.com/${{ github.repository }}/releases/download/proxmox-backup-client-static-${{ steps.check.outputs.version }}
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  export HOMEBREW_NO_AUTO_UPDATE=1
                  brew uninstall local/test/proxmox-backup-client-static
                  brew install --build-bottle local/test/proxmox-backup-client-static
                  mkdir -p bottle
                  cd bottle
                  brew bottle --json --no-rebuild \
                      --root-url "$ROOT_URL" \
                      local/test/proxmox-backup-client-static
                  # brew bottle names the local file with "--" while the URL it is
                  # downloaded from uses "-", so rename it to the remote filename.
                  python3 - <<'PY'
                  import glob
                  import json
                  import os

                  data = json.load(open(glob.glob("*.bottle.json")[0]))
                  for tag in next(iter(data.values()))["bottle"]["tags"].values():
                      if tag["local_filename"] != tag["filename"]:
                          os.rename(tag["local_filename"], tag["filename"])
                      print(f"Bottle asset: {tag['filename']}")
                  PY

            - name: Add bottle block to formula
              if: steps.check.outputs.changed == 'true'
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  export HOMEBREW_NO_AUTO_UPDATE=1
                  cd bottle
                  brew bottle --merge --write --no-commit ./*.bottle.json
                  cp "$(brew --repository local/test)/Formula/proxmox-backup-client-static.rb" \
                      "$GITHUB_WORKSPACE/Formula/proxmox-backup-client-static.rb"

            - name: Upload bottle to GitHub release
              if: steps.check.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: proxmox-backup-client-static-${{ steps.check.outputs.version }}
                  VERSION: ${{ steps.check.outputs.version }}
              run: |
                  if ! gh release view "$TAG" >/dev/null 2>&1; then
                      gh release create "$TAG" \
                          --title "$TAG" \
                          --notes "Bottle for proxmox-backup-client-static $VERSION"
                  fi
                  gh release upload "$TAG" bottle/*.bottle.tar.gz --clobber

            - name: Commit bottle and push update
              if: steps.check.outputs.changed == 'true'
              run: |
                  git add Formula/proxmox-backup-client-static.rb
                  if ! git diff --cached --quiet; then
                      git commit -m "bottle: proxmox-backup-client-static ${{ steps.check.outputs.version }}"
                  fi
                  git push
